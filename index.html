<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冷笑话收集站</title>
<meta name="description" content="独角兽身边漂着一堆泡泡，每个泡泡里藏一个冷笑话。点开看，再点就炸。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+KuaiLe&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --lime:#cdef9c; --cream:#f6f4e3; --ink:#141414;
  --neon:#e8f500; --green:#00e676; --mint:#5eead4; --pink:#f9a8d4;
  --purple:#b197fc; --orange:#ff8a3d; --sky:#9adcf9; --white:#fff;
  --shadow:5px 5px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --display:"Lilita One","ZCOOL KuaiLe","Microsoft YaHei",sans-serif;
  --zh:"ZCOOL KuaiLe","Lilita One","Microsoft YaHei",sans-serif;
  --body:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;
  --bounce:cubic-bezier(.2,1.6,.4,1);
  --dock:66px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background-color:var(--lime);
  background-image:linear-gradient(rgba(20,20,20,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(20,20,20,.07) 1px,transparent 1px);
  background-size:36px 36px;overflow:hidden}
img{display:block}

/* ---------- 加载 ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--lime);background-image:inherit;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
.loader.off{opacity:0;visibility:hidden}
.loader .box{background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:16px;transform:rotate(-2deg)}
.loader img{width:110px;filter:drop-shadow(4px 4px 0 rgba(20,20,20,.85));animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-16px) rotate(6deg)}}
.loader .txt{font-family:var(--zh);font-size:24px}
.loader .bar{width:240px;height:22px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--neon) 0 10px,var(--green) 10px 20px);transition:width .25s}

/* ---------- 场地：一屏，不滚动 ---------- */
.field{position:absolute;left:0;top:0;right:0;bottom:var(--dock);overflow:hidden}
.hero{position:absolute;z-index:3;filter:drop-shadow(7px 7px 0 rgba(20,20,20,.9));pointer-events:none;transform-origin:50% 100%}
.hero.float{animation:floaty 4.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}

/* 彩虹标题 */
.rainbow{position:absolute;left:10px;top:4px;width:440px;z-index:2;pointer-events:none}
.rainbow svg{width:100%;height:auto;overflow:visible}
.rainbow .en{position:absolute;left:28%;bottom:16%;font-family:var(--display);font-size:clamp(13px,1.5vw,20px);letter-spacing:.08em;background:var(--neon);padding:5px 12px;border:3px solid var(--ink);border-radius:999px;box-shadow:var(--shadow-sm);transform:rotate(-2deg);pointer-events:auto}
.rainbow .tagline{position:absolute;left:18%;bottom:-8%;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--shadow-sm);padding:7px 12px;font-weight:800;font-size:clamp(11px,1.1vw,14px);width:max-content;max-width:72%;transform:rotate(1.5deg);pointer-events:auto}
.rainbow .tagline b{background:var(--pink);padding:0 6px;border-radius:6px}

/* ---------- 泡泡 ---------- */
.bubble{position:absolute;left:0;top:0;z-index:4;border-radius:50%;cursor:pointer;will-change:transform;
  border:3px solid var(--ink);
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0, rgba(255,255,255,.4) 16%, var(--c) 48%, var(--c) 86%, rgba(20,20,20,.18) 100%);
  box-shadow:inset -6px -8px 0 rgba(20,20,20,.08), 4px 5px 0 rgba(20,20,20,.55)}
.bubble::before{content:"";position:absolute;left:14%;top:9%;width:30%;height:18%;border-radius:50%;background:#fff;transform:rotate(-30deg);opacity:.9;pointer-events:none}
.bubble::after{content:"";position:absolute;right:16%;bottom:12%;width:12%;height:8%;border-radius:50%;background:#fff;opacity:.7;pointer-events:none}
.bubble.pic{background-image:var(--img);background-size:cover;background-position:center}
.bubble.pic .tint{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.75) 0, rgba(255,255,255,.1) 30%, rgba(255,255,255,0) 55%, rgba(20,20,20,.2) 100%);pointer-events:none}
.bubble .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;pointer-events:none}
.bubble .big{font-family:var(--display);font-size:calc(var(--d) * .42);line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.bubble .uni{height:52%;width:auto;filter:drop-shadow(3px 3px 0 rgba(20,20,20,.8))}
.bubble .hint{font-weight:800;font-size:max(10px,calc(var(--d) * .09));background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;padding:3px 8px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.bubble.small .hint{display:none}
.bubble .wob{position:absolute;inset:-3px;border-radius:50%;animation:wob var(--wt,5s) ease-in-out infinite;pointer-events:none}
@keyframes wob{0%,100%{transform:scale(1,1)}25%{transform:scale(1.025,.975)}50%{transform:scale(.98,1.02)}75%{transform:scale(1.015,.985)}}

/* 打开的泡泡 */
.bubble.open{z-index:30;background:radial-gradient(circle at 32% 28%, #fff 0, rgba(255,255,255,.9) 30%, var(--c) 100%);box-shadow:inset -8px -10px 0 rgba(20,20,20,.08), 6px 7px 0 var(--ink)}
.bubble.open .face{display:none}
.bubble .inner{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74%;height:74%;overflow:hidden;flex-direction:column;justify-content:center}
.bubble.open .inner{display:flex}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;font-weight:800;margin-bottom:8px;justify-content:center}
.pill{border:2.5px solid var(--ink);border-radius:999px;padding:3px 8px;background:#fff;box-shadow:2px 2px 0 var(--ink);line-height:1}
.pill.cc{font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em;background:var(--sky)}
.pill.topic{background:var(--topic,var(--neon))}
.date{font-family:ui-monospace,Consolas,monospace;font-size:10px;opacity:.65}
.setup{font-size:15px;line-height:1.5;white-space:pre-line;font-weight:700;margin:0;text-align:center}
.zh .setup{font-size:16px}
.punchbox{position:relative;margin-top:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:9px 12px;transition:background .3s}
.punch{margin:0;font-size:16px;line-height:1.45;font-weight:800;white-space:pre-line;filter:blur(7px);transform:scale(.92);transition:filter .5s,transform .5s var(--bounce);user-select:none;text-align:center}
.zh .punch{font-size:17px}
.tape{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);background:var(--neon);border:3px solid var(--ink);border-radius:8px;padding:6px 12px;font:800 13px/1 var(--body);box-shadow:3px 3px 0 var(--ink);white-space:nowrap;transition:transform .55s var(--bounce),opacity .4s}
.tape::before,.tape::after{content:"";position:absolute;top:-8px;width:30px;height:12px;background:rgba(255,255,255,.55);border:2px solid var(--ink);transform:rotate(-30deg);left:-10px}
.tape::after{left:auto;right:-10px;transform:rotate(30deg)}
.punchbox.drum{animation:drum .5s ease-in-out}
@keyframes drum{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px) rotate(-1.5deg)}30%{transform:translateX(5px) rotate(1.5deg)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.punchbox.shown{background:var(--neon)}
.punchbox.shown .punch{filter:blur(0);transform:scale(1);user-select:auto}
.punchbox.shown .tape{transform:translate(-50%,-50%) translateY(-60px) rotate(25deg) scale(.6);opacity:0;pointer-events:none}
.note{margin:8px 0 0;font-size:12px;line-height:1.4;background:#fff;border:2.5px dashed var(--ink);border-radius:10px;padding:6px 9px}
.note::before{content:"笑点 → ";font-weight:800}
.punchbox:not(.shown) + .note{display:none}
.bye{margin:8px 0 0;font-size:11px;font-weight:800;opacity:.55;text-align:center}
.punchbox:not(.shown) ~ .bye{display:none}
.spark{position:absolute;left:50%;top:50%;width:14px;height:14px;pointer-events:none;animation:spark .8s ease-out forwards;z-index:9}
.spark svg{width:100%;height:100%;overflow:visible}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(180deg);opacity:0}}

/* 投币：硬币按钮 + 数字；点了之后投币口冒出来，爪子拿币塞进去 */
.like{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;position:relative}
.coin{appearance:none;border:0;background:none;padding:0;width:40px;height:40px;position:relative;cursor:pointer;transition:transform .15s var(--bounce)}
.coin svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 3px 0 var(--ink))}
.coin:hover{transform:translateY(-3px) rotate(-10deg)}
.coin.bump{animation:bump .4s var(--bounce)}
@keyframes bump{30%{transform:scale(1.3) rotate(15deg)}}
.likecount{font-family:var(--display);font-size:20px;line-height:1;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:5px 11px;box-shadow:2px 2px 0 var(--ink);min-width:46px;text-align:center}
.likecount.up{animation:bump .35s var(--bounce)}
.slot{position:absolute;right:17%;bottom:15%;width:72px;height:52px;transform:scale(0);transform-origin:bottom right;transition:transform .4s var(--bounce);z-index:5;pointer-events:none}
.slot svg{width:100%;height:100%;overflow:visible}
.slot.show{transform:scale(1)}
.slot.eat{animation:eat .45s ease-in-out}
@keyframes eat{30%{transform:scale(1.08,.92)}60%{transform:scale(.96,1.06)}}
.pawcoin{position:absolute;width:64px;height:84px;z-index:6;pointer-events:none;left:0;top:0}
.pawcoin svg{width:100%;height:100%;overflow:visible}
.plusone{position:absolute;z-index:7;pointer-events:none;font-family:var(--display);font-size:24px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);animation:rise 1s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0) scale(.6);opacity:0}30%{opacity:1}to{transform:translate(-50%,-70px) scale(1.2);opacity:0}}

/* 泡泡炸掉的水珠 */
.drop{position:absolute;border-radius:50%;border:2.5px solid var(--ink);pointer-events:none;z-index:35;animation:dropfly .7s ease-out forwards}
@keyframes dropfly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* ---------- 底部筛选条 ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;height:var(--dock);z-index:40;background:var(--cream);border-top:3px solid var(--ink);padding:0 14px;display:flex;gap:9px;align-items:center;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{appearance:none;cursor:pointer;font:800 13px/1 var(--body);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 13px;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;flex:0 0 auto}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.chip:active,.chip.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.chip.on{background:var(--green)}
.chip[data-k="lang"].on{background:var(--neon)}
.chip.shuffle{background:var(--purple);margin-left:auto}
.chip.shuffle:hover{background:var(--pink)}
.chip.again2{background:var(--orange)}
.dock .sep{width:3px;height:26px;background:var(--ink);border-radius:2px;margin:0 2px;flex:0 0 auto}
.count{font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}
.dock a{color:var(--ink);font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;font-size:18px;text-align:center;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:14px 20px;box-shadow:var(--shadow-sm)}

/* 爪子鼠标 */
body{cursor:url("img/paw.svg") 6 6, auto}
body a,body button,body .chip,body .bubble,body .coin{cursor:url("img/paw-press.svg") 8 8, pointer}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="box">
    <img src="img/hero_wave.png" alt="">
    <div class="txt">泡泡吹制中…</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>

<main class="field" id="field">
  <div class="rainbow" id="rainbow">
    <svg viewBox="0 0 600 340" aria-label="冷笑话收集站">
      <defs><path id="arc" d="M 22 330 A 278 278 0 0 1 578 330"/></defs>
      <g fill="none" stroke-linecap="round">
        <path d="M 70 330 A 230 230 0 0 1 530 330" stroke="#141414" stroke-width="44"/>
        <path d="M 70 330 A 230 230 0 0 1 530 330" stroke="#f9a8d4" stroke-width="36"/>
        <path d="M 108 330 A 192 192 0 0 1 492 330" stroke="#141414" stroke-width="8"/>
        <path d="M 108 330 A 192 192 0 0 1 492 330" stroke="#e8f500" stroke-width="36"/>
        <path d="M 146 330 A 154 154 0 0 1 454 330" stroke="#141414" stroke-width="8"/>
        <path d="M 146 330 A 154 154 0 0 1 454 330" stroke="#5eead4" stroke-width="36"/>
        <path d="M 184 330 A 116 116 0 0 1 416 330" stroke="#141414" stroke-width="4"/>
      </g>
      <text font-family="ZCOOL KuaiLe, Lilita One, Microsoft YaHei, sans-serif" font-size="74" fill="#fff" stroke="#141414" stroke-width="3" paint-order="stroke" letter-spacing="4">
        <textPath href="#arc" startOffset="50%" text-anchor="middle">冷笑话收集站</textPath>
      </text>
      <path d="M 50 110 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z" fill="#fff" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 560 150 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 z" fill="#ff8a3d" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <span class="en">COLD JOKES &amp; PUNS</span>
    <div class="tagline">独角兽吹的泡泡。点一下看题，再点揭<b>谜底</b>，再点就炸。</div>
  </div>
  <img class="hero" id="hero" src="img/hero.png" alt="毛茸茸的独角兽">
</main>

<nav class="dock" id="dock">
  <button class="chip on" data-k="all">全部</button>
  <span class="sep"></span>
  <button class="chip shuffle" id="shuffle">🎲 随机开一个</button>
  <button class="chip again2" id="rescatter">🫧 再吹一次</button>
  <span class="count" id="count"></span>
  <a href="https://github.com/joyfuljune/cold-jokes/edit/main/jokes.json" target="_blank" rel="noopener">＋添一条</a>
</nav>

<script>
const LANG = {zh:"中文",en:"English",fr:"Français"};
const COLORS = ["rgba(232,245,0,.85)","rgba(0,230,118,.75)","rgba(94,234,212,.8)","rgba(249,168,212,.85)","rgba(177,151,252,.8)","rgba(255,138,61,.75)","rgba(154,220,249,.85)","rgba(255,255,255,.8)"];
const TOPIC_COLORS = {"动物":"#00e676","食物":"#ff8a3d","科学":"#9adcf9","语言":"#f9a8d4","职业":"#b197fc","日常":"#e8f500","数学":"#5eead4"};
const EMOJI = {"动物":"🐧","食物":"🍅","科学":"🧪","语言":"💬","职业":"💼","日常":"☕","数学":"📐"};
const PICS = ["img/scene.jpg","img/scene2.jpg","img/mid.jpg","img/hallo.jpg","img/hike.jpg","img/hotpot.jpg"];
const PRELOAD = ["img/hero.png","img/hero_wave.png","img/paw.svg","img/paw-press.svg", ...PICS, ...[1,2,3,4,5,6].map(i=>`img/uni${i}.png`)];
const COIN_SVG = `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#e8f500" stroke="#141414" stroke-width="3"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="#141414" stroke-width="2.2" stroke-dasharray="3 3"/><text x="20" y="25" text-anchor="middle" font-family="ZCOOL KuaiLe, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#141414">冷</text></svg>`;
/* 游戏机投币口：面板 + 竖缝 + 小箭头，没有文字 */
const SLOT_SVG = `<svg viewBox="0 0 72 52"><rect x="2" y="10" width="68" height="40" rx="10" fill="#b197fc" stroke="#141414" stroke-width="3"/><rect x="10" y="17" width="52" height="26" rx="7" fill="#fff" stroke="#141414" stroke-width="2.5"/><rect x="32" y="20" width="8" height="20" rx="3" fill="#141414"/><rect x="34" y="22" width="4" height="16" rx="2" fill="#5eead4"/><path d="M36 1 l6 7 h-12 z" fill="#ff8a3d" stroke="#141414" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="30" r="3" fill="#e8f500" stroke="#141414" stroke-width="1.5"/><circle cx="56" cy="30" r="3" fill="#e8f500" stroke="#141414" stroke-width="1.5"/></svg>`;
/* 爪子举着币 */
const PAWCOIN_SVG = `<svg viewBox="0 0 64 84"><g class="pc"><circle cx="32" cy="18" r="15" fill="#e8f500" stroke="#141414" stroke-width="3"/><circle cx="32" cy="18" r="10" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="3 3"/><text x="32" y="23" text-anchor="middle" font-family="ZCOOL KuaiLe, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#141414">冷</text></g><g transform="translate(8,30) scale(1.5)"><g stroke="#141414" stroke-width="2.2" stroke-linejoin="round"><ellipse cx="7" cy="11" rx="3.6" ry="4.4" fill="#fff" transform="rotate(-18 7 11)"/><ellipse cx="15" cy="6.5" rx="3.6" ry="4.4" fill="#fff"/><ellipse cx="23.5" cy="10" rx="3.6" ry="4.4" fill="#fff" transform="rotate(18 23.5 10)"/><path d="M5.5 21.5 C5.5 15.5 26.5 15.5 26.5 21.5 C26.5 27.5 21 30.5 16 30.5 C11 30.5 5.5 27.5 5.5 21.5 Z" fill="#fff"/></g><ellipse cx="7" cy="11" rx="1.6" ry="2.1" fill="#f9a8d4" transform="rotate(-18 7 11)"/><ellipse cx="15" cy="6.5" rx="1.6" ry="2.1" fill="#f9a8d4"/><ellipse cx="23.5" cy="10" rx="1.6" ry="2.1" fill="#f9a8d4" transform="rotate(18 23.5 10)"/><path d="M9.5 22 C9.5 18.5 22.5 18.5 22.5 22 C22.5 25.5 19 27.5 16 27.5 C13 27.5 9.5 25.5 9.5 22 Z" fill="#f9a8d4"/></g></svg>`;

let jokes = [], filter = {k:"all", v:null};
const fake = {};
const field = document.getElementById("field"), hero = document.getElementById("hero"), dock = document.getElementById("dock"), countEl = document.getElementById("count");
const R = Math.random, rnd = (a,b) => a + R()*(b-a), pick = arr => arr[Math.floor(R()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function isQuestion(s){ return /[?？]\s*$/.test(s.trim()); }

function metaHTML(j){
  const tc = TOPIC_COLORS[j.topic] || "#e8f500";
  return `<span class="pill cc">${esc(j.country)}</span><span class="pill">${esc(LANG[j.lang] || j.lang)}</span><span class="pill topic" style="--topic:${tc}">${EMOJI[j.topic]||"✨"} ${esc(j.topic)}</span><span class="date">${esc(j.date)}</span>`;
}
function bodyHTML(j){
  const label = isQuestion(j.setup) ? "🫣 揭晓谜底" : "👀 看下一句";
  if(fake[j.id]==null) fake[j.id] = 3 + Math.floor(R()*300);
  return `<div class="meta">${metaHTML(j)}</div>
    <p class="setup">${esc(j.setup)}</p>
    <div class="punchbox"><p class="punch">${esc(j.punch)}</p><span class="tape">${label}</span></div>
    ${j.note ? `<p class="note">${esc(j.note)}</p>` : ""}
    <div class="like"><button class="coin" data-id="${j.id}" title="投一枚冷币">${COIN_SVG}</button><span class="likecount" data-count="${j.id}">${fake[j.id]}</span></div>
    <p class="bye">再点一下泡泡就炸</p>`;
}
function faceHTML(j, a){
  let middle;
  if(a.kind==="pic") middle = "";
  else if(a.kind==="uni") middle = `<img class="uni" src="img/uni${a.uni}.png" alt="">`;
  else if(a.kind==="emoji") middle = `<span class="big">${EMOJI[j.topic]||"?"}</span>`;
  else middle = `<span class="big">?</span>`;
  return `${a.kind==="pic" ? '<div class="tint"></div>' : ''}<div class="face">${middle}<span class="hint">${EMOJI[j.topic]||"✨"} ${esc(j.topic)}</span></div>`;
}
/* 封面分配：图片各一次、贴纸各一次、emoji 每主题一次 */
function assign(list){
  const n = list.length, order = shuffle(list.map((_,i)=>i)), out = new Array(n);
  const picIdx = order.slice(0, Math.min(PICS.length, n)), uniIdx = order.slice(PICS.length, PICS.length+6), emojiTopics = new Set();
  const cols = shuffle(COLORS);
  list.forEach((j,i) => {
    const a = {color: cols[i%cols.length], kind:"q"};
    const pi = picIdx.indexOf(i);
    if(pi >= 0){ a.kind="pic"; a.pic = PICS[pi]; }
    else if(uniIdx.includes(i)){ a.kind="uni"; a.uni = uniIdx.indexOf(i)+1; }
    else if(!emojiTopics.has(j.topic) && R()<.6){ a.kind="emoji"; emojiTopics.add(j.topic); }
    out[i] = a;
  });
  return out;
}

/* ---------- 泡泡物理：往上浮、互相挤、绕开独角兽和彩虹 ---------- */
let bodies = [], W = 0, H = 0, heroC = [], rainC = null, running = false, opened = null, topZ = 30;
function setupScene(){
  W = field.clientWidth; H = field.clientHeight;
  const hh = clamp(H*.5, 200, 470), hw = hh*686/900;
  const hx = W*(.5 + rnd(-.06,.06)) - hw/2, hy = H*.5 - hh*.5 + rnd(-20,20);
  hero.style.width = hw+"px"; hero.style.left = hx+"px"; hero.style.top = hy+"px";
  /* 独角兽用三个圆近似：头、身、底 */
  heroC = [ {x:hx+hw*.5, y:hy+hh*.3, r:hw*.44}, {x:hx+hw*.5, y:hy+hh*.62, r:hw*.5}, {x:hx+hw*.5, y:hy+hh*.86, r:hw*.46} ];
  const rw = Math.min(440, W*.36); document.getElementById("rainbow").style.width = rw+"px";
  rainC = {x:10+rw*.5, y:4+rw*.3, r:rw*.55};
  return {cx:hx+hw*.5, cy:hy+hh*.8};
}
function step(){
  const n = bodies.length;
  for(const b of bodies){
    if(!b.live) continue;
    if(b.open){ b.vx *= .6; b.vy *= .6; } else { b.vy -= b.buoy; b.vx += rnd(-.04,.04); b.vy += rnd(-.03,.03); b.vx *= .94; b.vy *= .94; }
    b.x += b.vx; b.y += b.vy;
    if(b.tr !== b.r){ b.r += (b.tr - b.r)*.25; if(Math.abs(b.tr-b.r)<.5) b.r = b.tr; b.el.style.width = b.el.style.height = (b.r*2)+"px"; b.el.style.setProperty("--d", (b.r*2)+"px"); }
  }
  for(let it=0; it<3; it++){
    for(const b of bodies){
      if(!b.live) continue;
      /* 独角兽和彩虹 */
      for(const c of heroC.concat([rainC])){
        const dx = b.x-c.x, dy = b.y-c.y, d = Math.hypot(dx,dy) || .01, m = b.r + c.r;
        if(d < m){ const k = (m-d)/d; b.x += dx*k; b.y += dy*k; b.vx += dx/d*.3; b.vy += dy/d*.3; }
      }
    }
    for(let i=0;i<n;i++){ const a = bodies[i]; if(!a.live) continue;
      for(let j=i+1;j<n;j++){ const b = bodies[j]; if(!b.live) continue;
        const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || .01, m = a.r + b.r + 4;
        if(d < m){ const k = (m-d)/d, ma = a.open?1e7:a.r*a.r, mb = b.open?1e7:b.r*b.r, s = ma+mb;
          a.x -= dx*k*(mb/s); a.y -= dy*k*(mb/s); b.x += dx*k*(ma/s); b.y += dy*k*(ma/s); }
      }
    }
    /* 墙放最后，保证谁都不出屏幕 */
    for(const b of bodies){
      if(!b.live) continue;
      if(b.x < b.r+4){ b.x = b.r+4; b.vx *= -.3; } if(b.x > W-b.r-4){ b.x = W-b.r-4; b.vx *= -.3; }
      if(b.y < b.r+6){ b.y = b.r+6; b.vy *= -.3; } if(b.y > H-b.r-4){ b.y = H-b.r-4; b.vy *= -.3; }
    }
  }
  for(const b of bodies){ if(b.live) b.el.style.transform = `translate(${(b.x-b.r).toFixed(1)}px,${(b.y-b.r).toFixed(1)}px)`; }
}
function loop(){ if(!running) return; step(); requestAnimationFrame(loop); }

/* ---------- 吹泡泡 ---------- */
function render(){
  const list = jokes.filter(j => filter.k==="all" || j[filter.k]===filter.v);
  field.querySelectorAll(".bubble,.empty,.drop").forEach(e=>e.remove());
  bodies = []; opened = null;
  const o = setupScene();
  const covers = assign(list);
  const free = W*H - Math.PI*heroC[1].r*heroC[1].r*2.2 - Math.PI*rainC.r*rainC.r*.6;
  const r0 = clamp(Math.sqrt(free*.42/Math.max(list.length,1)/Math.PI), 26, 120);
  list.forEach((j,i) => {
    const a = covers[i];
    const r = Math.round(r0 * (a.kind==="pic" ? rnd(1.35,1.75) : rnd(.55,1.45)));
    const el = document.createElement("div");
    el.className = `bubble ${a.kind==="pic"?"pic":""} ${r<42?"small":""} ${j.lang==="zh"?"zh":""}`;
    el.style.cssText = `width:${r*2}px;height:${r*2}px;--d:${r*2}px;--c:${a.color};${a.kind==="pic"?`--img:url('${a.pic}')`:""};--wt:${rnd(4,7).toFixed(1)}s;opacity:0`;
    el.innerHTML = `<div class="wob"></div>${faceHTML(j,a)}<div class="inner"></div>`;
    const b = {j, a, el, r, tr:r, r0:r, x:o.cx+rnd(-30,30), y:o.cy, vx:rnd(-7,7), vy:rnd(-9,-3), buoy: .05 + (r/r0)*.06*rnd(.5,1.6), live:false, open:false};
    el.addEventListener("click", e => onClick(b, e));
    field.appendChild(el); bodies.push(b);
  });
  shuffle(bodies).forEach((b,i) => setTimeout(() => { b.live = true; b.el.style.opacity = 1; b.el.animate([{transform:`translate(${b.x-b.r}px,${b.y-b.r}px) scale(.1)`},{transform:`translate(${b.x-b.r}px,${b.y-b.r}px) scale(1)`}], {duration:350, easing:"cubic-bezier(.2,1.5,.4,1)"}); }, 700 + i*45));
  if(!list.length){ const e = document.createElement("div"); e.className="empty"; e.textContent="一个泡泡都没有。"; field.appendChild(e); }
  countEl.textContent = `${list.length} / ${jokes.length} 个泡泡`;
  if(!running){ running = true; loop(); }
}

/* ---------- 点泡泡：开 → 揭谜底 → 炸 ---------- */
function onClick(b, e){
  if(e.target.closest(".coin")){ dropCoin(e.target.closest(".coin"), b); return; }
  if(!b.open){ openBubble(b); return; }
  const box = b.el.querySelector(".punchbox");
  if(!box.classList.contains("shown")){ revealPunch(box); return; }
  popBubble(b);
}
function openBubble(b){
  if(opened && opened!==b) closeBubble(opened);
  b.open = true; opened = b;
  b.el.classList.add("open"); b.el.style.zIndex = ++topZ;
  b.el.querySelector(".inner").innerHTML = bodyHTML(b.j);
  b.tr = Math.min(260, (H-24)/2, (W-24)/2);
  b.vx = b.vy = 0;
}
function closeBubble(b){
  b.open = false; b.tr = b.r0; b.el.classList.remove("open"); b.el.style.zIndex = "";
  b.el.querySelector(".inner").innerHTML = ""; b.el.querySelector(".slot")?.remove();
  if(opened===b) opened = null;
}
function revealPunch(box){
  if(box.classList.contains("drum")) return;
  box.classList.add("drum");
  setTimeout(() => { box.classList.remove("drum"); box.classList.add("shown"); burst(box); }, 480);
}
function popBubble(b){
  b.live = false; if(opened===b) opened = null;
  const el = b.el, x = b.x, y = b.y, r = b.r;
  el.style.pointerEvents = "none";
  el.animate([{transform:`translate(${x-r}px,${y-r}px) scale(1)`, opacity:1},{transform:`translate(${x-r}px,${y-r}px) scale(1.18)`, opacity:.9, offset:.4},{transform:`translate(${x-r}px,${y-r}px) scale(1.35)`, opacity:0}], {duration:260, easing:"ease-out", fill:"forwards"}).onfinish = () => el.remove();
  for(let i=0;i<12;i++){
    const d = document.createElement("div"); d.className="drop";
    const s = rnd(8,22), ang = (i/12)*Math.PI*2 + rnd(-.3,.3), dist = r*rnd(.9,1.8);
    d.style.cssText = `left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:${b.a.color};--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist+30}px`;
    field.appendChild(d); setTimeout(()=>d.remove(), 750);
  }
  bodies = bodies.filter(x => x!==b);
  countEl.textContent = `${bodies.length} / ${jokes.length} 个泡泡`;
  if(!bodies.length){ const e = document.createElement("div"); e.className="empty"; e.innerHTML="泡泡都炸完了，按下面的 🫧 再吹一次。"; field.appendChild(e); }
}
field.addEventListener("click", e => { if(opened && !e.target.closest(".bubble")) closeBubble(opened); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && opened) closeBubble(opened); });

function burst(host, x, y, n=10){
  const colors = ["#e8f500","#ff8a3d","#f9a8d4","#5eead4","#b197fc","#fff"];
  for(let i=0;i<n;i++){
    const s = document.createElement("span"); s.className="spark";
    if(x!=null){ s.style.left = x+"px"; s.style.top = y+"px"; }
    const ang = (i/n)*Math.PI*2 + R(), d = 50 + R()*50;
    s.style.setProperty("--dx", Math.cos(ang)*d+"px"); s.style.setProperty("--dy", Math.sin(ang)*d+"px");
    s.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 5 L62 38 L95 50 L62 62 L50 95 L38 62 L5 50 L38 38 Z" fill="${colors[i%colors.length]}" stroke="#141414" stroke-width="8" stroke-linejoin="round"/></svg>`;
    host.appendChild(s); setTimeout(()=>s.remove(), 900);
  }
}

/* ---------- 投币：投币口冒出来，爪子举着币从下面伸上来塞进缝里 ---------- */
let coinBusy = false;
function dropCoin(btn, b){
  if(coinBusy) return; coinBusy = true;
  const host = b.el, id = btn.dataset.id;
  let slot = host.querySelector(".slot");
  if(!slot){ slot = document.createElement("div"); slot.className="slot"; slot.innerHTML = SLOT_SVG; host.appendChild(slot); }
  clearTimeout(slot._hide);
  requestAnimationFrame(() => slot.classList.add("show"));
  btn.classList.remove("bump"); void btn.offsetWidth; btn.classList.add("bump");
  const D = host.offsetWidth;
  const sx = D - D*.17 - 36 - 32, sy = D - D*.15 - 52;      // 投币口在圆内右下，缝在面板中上部
  const pc = document.createElement("div"); pc.className="pawcoin"; pc.innerHTML = PAWCOIN_SVG;
  pc.style.left = sx+"px"; pc.style.top = (sy+22)+"px"; host.appendChild(pc);
  const coinG = pc.querySelector(".pc");
  pc.animate([{transform:"translateY(120px) rotate(10deg)", opacity:0},{transform:"translateY(0) rotate(0)", opacity:1}], {duration:420, easing:"cubic-bezier(.2,1.2,.4,1)", fill:"forwards"}).onfinish = () => {
    coinG.animate([{transform:"translateY(0) scaleX(1)"},{transform:"translateY(-22px) scaleX(.1)", opacity:0}], {duration:260, easing:"ease-in", fill:"forwards"}).onfinish = () => {
      slot.classList.remove("eat"); void slot.offsetWidth; slot.classList.add("eat");
      fake[id] = (fake[id]||0) + 1;
      host.querySelectorAll(`.likecount[data-count="${id}"]`).forEach(c => { c.textContent = fake[id]; c.classList.remove("up"); void c.offsetWidth; c.classList.add("up"); });
      const plus = document.createElement("span"); plus.className="plusone"; plus.textContent="+1";
      plus.style.left = (sx+36) + "px"; plus.style.top = (sy-6) + "px";
      host.appendChild(plus); setTimeout(()=>plus.remove(), 1000);
      burst(host, sx+36, sy+10, 8);
      pc.animate([{transform:"translateY(0)"},{transform:"translateY(130px)", opacity:0}], {duration:380, easing:"ease-in", fill:"forwards"}).onfinish = () => { pc.remove(); coinBusy = false; };
      slot._hide = setTimeout(() => slot.classList.remove("show"), 1400);
    };
  };
}

/* ---------- 底部 ---------- */
function buildChips(){
  const langs = ["zh","en","fr"].filter(l => jokes.some(j=>j.lang===l)).concat([...new Set(jokes.map(j=>j.lang))].filter(l=>!["zh","en","fr"].includes(l)));
  const topics = [...new Set(jokes.map(j=>j.topic))];
  const mk = (k,v,label) => { const b = document.createElement("button"); b.className="chip"; b.dataset.k=k; b.dataset.v=v; b.textContent=label; return b; };
  const anchor = document.getElementById("shuffle");
  langs.forEach(l => dock.insertBefore(mk("lang", l, LANG[l]||l), anchor));
  const sep = document.createElement("span"); sep.className="sep"; dock.insertBefore(sep, anchor);
  topics.forEach(t => dock.insertBefore(mk("topic", t, (EMOJI[t]||"")+" "+t), anchor));
}
dock.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b || !b.dataset.k) return;
  dock.querySelectorAll(".chip[data-k]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  filter = b.dataset.k==="all" ? {k:"all",v:null} : {k:b.dataset.k, v:b.dataset.v};
  render();
});
document.getElementById("rescatter").onclick = () => { hero.classList.remove("float"); heroDrop(); render(); };
document.getElementById("shuffle").onclick = () => { const c = bodies.filter(b=>b.live && !b.open); if(c.length) openBubble(pick(c)); };

function heroDrop(){
  hero.animate([
    {transform:"translateY(-120vh) rotate(-8deg)", offset:0},
    {transform:"translateY(0) rotate(0)", offset:.75, easing:"cubic-bezier(.4,0,1,1)"},
    {transform:"translateY(0) scale(1.25,.72)", offset:.84},
    {transform:"translateY(-30px) scale(.92,1.08)", offset:.92},
    {transform:"translateY(0) scale(1,1)", offset:1}
  ], {duration:1250, easing:"ease-out", fill:"backwards"}).onfinish = () => { shake(); hero.classList.add("float"); };
}
function shake(){ document.body.animate([{transform:"translate(0,0)"},{transform:"translate(-6px,4px)"},{transform:"translate(5px,-3px)"},{transform:"translate(-3px,2px)"},{transform:"translate(0,0)"}], {duration:380}); }

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 250); });

function preload(){
  const bar = document.getElementById("bar");
  let done = 0; const total = PRELOAD.length + 1;
  const tick = () => { done++; bar.style.width = Math.round(done/total*100) + "%"; };
  const imgs = PRELOAD.map(src => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { tick(); res(); }; im.src = src; }));
  const fonts = (document.fonts ? document.fonts.ready : Promise.resolve()).then(tick);
  return Promise.all([...imgs, fonts]);
}
Promise.all([fetch("jokes.json").then(r=>r.json()), preload()]).then(([d]) => {
  jokes = d.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  buildChips();
  document.getElementById("loader").classList.add("off");
  setTimeout(() => { heroDrop(); render(); }, 350);
}).catch(err => { document.querySelector(".loader .txt").textContent = "读不到 jokes.json：" + err.message; });
</script>
