<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冷笑话收集站</title>
<meta name="description" content="一座石头山被独角兽坐塌了，每块石头背后藏一个冷笑话。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+KuaiLe&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --lime:#cdef9c; --cream:#f6f4e3; --ink:#141414;
  --neon:#e8f500; --green:#00e676; --mint:#5eead4; --pink:#f9a8d4;
  --purple:#b197fc; --orange:#ff8a3d; --sky:#9adcf9; --white:#fff;
  --shadow:5px 5px 0 var(--ink); --shadow-sm:3px 3px 0 var(--ink);
  --display:"Lilita One","ZCOOL KuaiLe","Microsoft YaHei",sans-serif;
  --zh:"ZCOOL KuaiLe","Lilita One","Microsoft YaHei",sans-serif;
  --body:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;
  --bounce:cubic-bezier(.2,1.6,.4,1);
  --dock:66px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background-color:var(--lime);
  background-image:linear-gradient(rgba(20,20,20,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(20,20,20,.07) 1px,transparent 1px);
  background-size:36px 36px;overflow:hidden}
img{display:block}

/* ---------- 加载 ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--lime);background-image:inherit;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
.loader.off{opacity:0;visibility:hidden}
.loader .box{background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:16px;transform:rotate(-2deg)}
.loader img{width:120px;animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-16px) rotate(6deg)}}
.loader .txt{font-family:var(--zh);font-size:24px}
.loader .bar{width:240px;height:22px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--neon) 0 10px,var(--green) 10px 20px);transition:width .25s}

/* ---------- 场地：一屏装下，不滚动 ---------- */
.field{position:absolute;left:0;top:0;right:0;bottom:var(--dock);overflow:hidden}
.hero{position:absolute;z-index:3;filter:drop-shadow(7px 7px 0 rgba(20,20,20,.9));pointer-events:none;transform-origin:50% 100%}

/* 彩虹标题 */
.rainbow{position:absolute;left:10px;top:4px;width:460px;z-index:2;pointer-events:none}
.rainbow svg{width:100%;height:auto;overflow:visible}
.rainbow .en{position:absolute;left:28%;bottom:16%;font-family:var(--display);font-size:clamp(13px,1.5vw,20px);letter-spacing:.08em;background:var(--neon);padding:5px 12px;border:3px solid var(--ink);border-radius:999px;box-shadow:var(--shadow-sm);transform:rotate(-2deg);pointer-events:auto}
.rainbow .tagline{position:absolute;left:18%;bottom:-8%;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--shadow-sm);padding:7px 12px;font-weight:800;font-size:clamp(11px,1.1vw,14px);width:max-content;max-width:72%;transform:rotate(1.5deg);pointer-events:auto}
.rainbow .tagline b{background:var(--pink);padding:0 6px;border-radius:6px}

/* 小石子，填缝用 */
.pebble{position:absolute;z-index:1;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);pointer-events:none;border-radius:var(--r)}

/* ---------- 石头（卡片） ---------- */
.card{position:absolute;z-index:4;background:var(--cream);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:0;cursor:pointer;transform:rotate(var(--tilt,0deg));transition:box-shadow .2s;overflow:hidden}
.card:hover{box-shadow:7px 7px 0 var(--ink)}
.card .inner{display:none;padding:26px 24px 22px}
.card.open{z-index:30;overflow:visible;cursor:default;border-radius:24px;transform:none}
.card.open .inner{display:block}
.card.open .cover{display:none}
.card .x{display:none;position:absolute;top:-16px;right:-16px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--orange);font:800 20px/1 var(--body);cursor:pointer;box-shadow:var(--shadow-sm);z-index:5}
.card.open .x{display:block}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;font-weight:800;margin-bottom:12px}
.pill{border:2.5px solid var(--ink);border-radius:999px;padding:4px 9px;background:#fff;box-shadow:2px 2px 0 var(--ink);line-height:1}
.pill.cc{font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em;background:var(--sky)}
.pill.topic{background:var(--topic,var(--neon))}
.date{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:11px;opacity:.65}
.setup{font-size:17px;line-height:1.55;white-space:pre-line;font-weight:700;margin:0}
.zh .setup{font-size:18px}

/* 谜底 */
.punchbox{position:relative;margin-top:14px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px 14px;cursor:pointer;transition:background .3s}
.punch{margin:0;font-size:18px;line-height:1.5;font-weight:800;white-space:pre-line;filter:blur(7px);transform:scale(.92);transition:filter .5s,transform .5s var(--bounce);user-select:none}
.zh .punch{font-size:19px}
.tape{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);background:var(--neon);border:3px solid var(--ink);border-radius:8px;padding:7px 14px;font:800 14px/1 var(--body);box-shadow:3px 3px 0 var(--ink);white-space:nowrap;transition:transform .55s var(--bounce),opacity .4s}
.tape::before,.tape::after{content:"";position:absolute;top:-8px;width:34px;height:14px;background:rgba(255,255,255,.55);border:2px solid var(--ink);transform:rotate(-30deg);left:-12px}
.tape::after{left:auto;right:-12px;transform:rotate(30deg)}
.punchbox:hover .tape{transform:translate(-50%,-50%) rotate(3deg) scale(1.06)}
.punchbox.drum{animation:drum .5s ease-in-out}
@keyframes drum{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px) rotate(-1.5deg)}30%{transform:translateX(5px) rotate(1.5deg)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.punchbox.shown{background:var(--neon);cursor:default}
.punchbox.shown .punch{filter:blur(0);transform:scale(1);user-select:auto}
.punchbox.shown .tape{transform:translate(-50%,-50%) translateY(-70px) rotate(25deg) scale(.6);opacity:0;pointer-events:none}
.spark{position:absolute;left:50%;top:50%;width:14px;height:14px;pointer-events:none;animation:spark .8s ease-out forwards;z-index:9}
.spark svg{width:100%;height:100%;overflow:visible}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(180deg);opacity:0}}
.note{margin:12px 0 0;font-size:13px;line-height:1.5;background:#fff;border:2.5px dashed var(--ink);border-radius:12px;padding:8px 10px}
.note::before{content:"笑点 → ";font-weight:800}
.punchbox:not(.shown) + .note{display:none}

/* 投币 */
.like{display:flex;align-items:center;gap:10px;margin-top:14px;position:relative}
.coin{appearance:none;border:0;background:none;padding:0;width:44px;height:44px;position:relative;transition:transform .15s var(--bounce)}
.coin svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 3px 0 var(--ink))}
.coin:hover{transform:translateY(-3px) rotate(-10deg)}
.coin:active{transform:translateY(2px) scale(.92)}
.coin.bump{animation:bump .4s var(--bounce)}
@keyframes bump{30%{transform:scale(1.3) rotate(15deg)}}
.liketxt{font-size:13px;font-weight:800;opacity:.8}
.likecount{font-family:var(--display);font-size:22px;line-height:1;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:5px 11px;box-shadow:2px 2px 0 var(--ink);min-width:48px;text-align:center}
.likecount.up{animation:bump .35s var(--bounce)}
.slot{position:absolute;right:14px;bottom:-16px;width:118px;height:62px;background:var(--pink);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow-sm);transform:scale(0) rotate(8deg);transform-origin:bottom right;transition:transform .45s var(--bounce);z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.slot .slit{width:48px;height:10px;background:var(--ink);border-radius:999px;box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
.slot .lbl{font:800 11px/1 var(--body);background:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:3px 8px}
.slot.show{transform:scale(1) rotate(-3deg)}
.slot.eat{animation:eat .5s ease-in-out}
@keyframes eat{25%{transform:scale(1.08,.9) rotate(-3deg)}55%{transform:scale(.95,1.1) rotate(-1deg)}}
.flycoin{position:absolute;width:40px;height:40px;z-index:6;pointer-events:none;left:0;top:0}
.flycoin svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(2px 2px 0 var(--ink))}
.plusone{position:absolute;z-index:7;pointer-events:none;font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);animation:rise 1s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0) scale(.6);opacity:0}30%{opacity:1}to{transform:translate(-50%,-70px) scale(1.2);opacity:0}}

/* ---------- 石头封面：按石头大小缩放 ---------- */
.cover{position:absolute;inset:-3px;border-radius:var(--r);background:var(--c,var(--neon));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(6px * var(--k));overflow:hidden}
.cover.dots{background-image:radial-gradient(rgba(20,20,20,.18) 1.6px,transparent 1.6px);background-size:14px 14px}
.cover.dots2{background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:26px 26px}
.cover.stripes{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 12px,transparent 12px 24px)}
.cover.hlines{background-image:repeating-linear-gradient(0deg,rgba(20,20,20,.16) 0 3px,transparent 3px 16px)}
.cover.grid{background-image:linear-gradient(rgba(20,20,20,.14) 2px,transparent 2px),linear-gradient(90deg,rgba(20,20,20,.14) 2px,transparent 2px);background-size:22px 22px}
.cover.checks{background-image:radial-gradient(rgba(255,255,255,.5) 28%,transparent 30%);background-size:34px 34px}
.cover.pic{background-size:cover;background-position:center;justify-content:flex-end;padding-bottom:calc(12px * var(--k))}
.cover.pic .hint{background:var(--neon)}
.cover .big{font-family:var(--display);font-size:calc(60px * var(--k));line-height:1;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.cover .uni{height:48%;width:auto;max-width:60%;filter:drop-shadow(3px 3px 0 rgba(20,20,20,.85))}
.card:hover .cover .uni{animation:wiggle .7s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.cover .hint{font-weight:800;font-size:max(10px,calc(13px * var(--k)));background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink);position:relative;z-index:1;white-space:nowrap}
.card.tiny .cover .hint{display:none}
.card.tiny .cover .big{font-size:calc(80px * var(--k))}

/* ---------- 底部筛选条 ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;height:var(--dock);z-index:40;background:var(--cream);border-top:3px solid var(--ink);padding:0 14px;display:flex;gap:9px;align-items:center;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{appearance:none;cursor:pointer;font:800 13px/1 var(--body);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 13px;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;flex:0 0 auto}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.chip:active,.chip.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.chip.on{background:var(--green)}
.chip[data-k="lang"].on{background:var(--neon)}
.chip.shuffle{background:var(--purple);margin-left:auto}
.chip.shuffle:hover{background:var(--pink)}
.chip.again2{background:var(--orange)}
.dock .sep{width:3px;height:26px;background:var(--ink);border-radius:2px;margin:0 2px;flex:0 0 auto}
.count{font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}
.dock a{color:var(--ink);font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:10px 10px 0 var(--ink);max-width:640px;width:100%;padding:34px 30px 26px;position:relative;animation:popin .4s var(--bounce) both}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1}}
.modal .setup{font-size:24px}
.modal .punch{font-size:24px}
.modal .close{position:absolute;top:-18px;right:-18px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--orange);font:800 22px/1 var(--body);cursor:pointer;box-shadow:var(--shadow-sm)}
.modal .again{margin-top:20px;margin-left:0}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;font-size:18px;text-align:center}

/* 爪子鼠标 */
body{cursor:url("img/paw.svg") 6 6, auto}
body a,body button,body .chip,body .card:not(.open),body .punchbox:not(.shown),body .coin,body .modal .close,body .card .x{cursor:url("img/paw-press.svg") 8 8, pointer}
body .card.open,body .punchbox.shown{cursor:url("img/paw.svg") 6 6, auto}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="box">
    <img src="img/uni4.png" alt="">
    <div class="txt">石头搬运中…</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>

<main class="field" id="field">
  <div class="rainbow" id="rainbow">
    <svg viewBox="0 0 600 340" aria-label="冷笑话收集站">
      <defs><path id="arc" d="M 22 330 A 278 278 0 0 1 578 330"/></defs>
      <g fill="none" stroke-linecap="round">
        <path d="M 70 330 A 230 230 0 0 1 530 330" stroke="#141414" stroke-width="44"/>
        <path d="M 70 330 A 230 230 0 0 1 530 330" stroke="#f9a8d4" stroke-width="36"/>
        <path d="M 108 330 A 192 192 0 0 1 492 330" stroke="#141414" stroke-width="8"/>
        <path d="M 108 330 A 192 192 0 0 1 492 330" stroke="#e8f500" stroke-width="36"/>
        <path d="M 146 330 A 154 154 0 0 1 454 330" stroke="#141414" stroke-width="8"/>
        <path d="M 146 330 A 154 154 0 0 1 454 330" stroke="#5eead4" stroke-width="36"/>
        <path d="M 184 330 A 116 116 0 0 1 416 330" stroke="#141414" stroke-width="4"/>
      </g>
      <text font-family="ZCOOL KuaiLe, Lilita One, Microsoft YaHei, sans-serif" font-size="74" fill="#fff" stroke="#141414" stroke-width="3" paint-order="stroke" letter-spacing="4">
        <textPath href="#arc" startOffset="50%" text-anchor="middle">冷笑话收集站</textPath>
      </text>
      <path d="M 50 110 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z" fill="#fff" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 560 150 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 z" fill="#ff8a3d" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <span class="en">COLD JOKES &amp; PUNS</span>
    <div class="tagline">石头山被独角兽坐塌了。点一块石头看题，再点一下揭<b>谜底</b>。</div>
  </div>
  <img class="hero" id="hero" src="img/hero.png" alt="毛茸茸的独角兽">
</main>

<nav class="dock" id="dock">
  <button class="chip on" data-k="all">全部</button>
  <span class="sep"></span>
  <button class="chip shuffle" id="shuffle">🎲 随机一条</button>
  <button class="chip again2" id="rescatter">🪄 再塌一次</button>
  <span class="count" id="count"></span>
  <a href="https://github.com/joyfuljune/cold-jokes/edit/main/jokes.json" target="_blank" rel="noopener">＋添一条</a>
</nav>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" id="close" aria-label="关闭">×</button>
    <div id="mbody"></div>
    <button class="chip shuffle again" id="again">🎲 再来一条</button>
  </div>
</div>

<script>
const LANG = {zh:"中文",en:"English",fr:"Français"};
const COLORS = ["#e8f500","#00e676","#5eead4","#f9a8d4","#b197fc","#ff8a3d","#9adcf9","#fff"];
const PATTERNS = ["dots","dots2","stripes","hlines","grid","checks"];
const TOPIC_COLORS = {"动物":"#00e676","食物":"#ff8a3d","科学":"#9adcf9","语言":"#f9a8d4","职业":"#b197fc","日常":"#e8f500","数学":"#5eead4"};
const EMOJI = {"动物":"🐧","食物":"🍅","科学":"🧪","语言":"💬","职业":"💼","日常":"☕","数学":"📐"};
/* 六幅场景图，每幅整页只用一次 */
const PICS = [
  {src:"img/scene.jpg", ar:1.5},{src:"img/scene2.jpg", ar:1.5},{src:"img/mid.jpg", ar:.67},
  {src:"img/hallo.jpg", ar:1.5},{src:"img/hike.jpg", ar:1},{src:"img/hotpot.jpg", ar:1.5},
];
const PRELOAD = ["img/hero.png","img/paw.svg","img/paw-press.svg", ...PICS.map(p=>p.src), ...[1,2,3,4,5,6].map(i=>`img/uni${i}.png`)];
const COIN_SVG = `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#e8f500" stroke="#141414" stroke-width="3"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="#141414" stroke-width="2.2" stroke-dasharray="3 3"/><text x="20" y="25" text-anchor="middle" font-family="ZCOOL KuaiLe, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#141414">冷</text></svg>`;

let jokes = [];
let filter = {k:"all", v:null};
const fake = {};
const field = document.getElementById("field");
const hero = document.getElementById("hero");
const dock = document.getElementById("dock");
const countEl = document.getElementById("count");

const R = Math.random;
const rnd = (a,b) => a + R()*(b-a);
const pick = arr => arr[Math.floor(R()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function isQuestion(s){ return /[?？]\s*$/.test(s.trim()); }
function blobRadius(){ const v = () => Math.round(rnd(35,65)); return `${v()}% ${v()}% ${v()}% ${v()}% / ${v()}% ${v()}% ${v()}% ${v()}%`; }

function metaHTML(j){
  const tc = TOPIC_COLORS[j.topic] || "#e8f500";
  return `<span class="pill cc">${esc(j.country)}</span><span class="pill">${esc(LANG[j.lang] || j.lang)}</span><span class="pill topic" style="--topic:${tc}">${EMOJI[j.topic]||"✨"} ${esc(j.topic)}</span><span class="date">${esc(j.date)}</span>`;
}
function bodyHTML(j){
  const label = isQuestion(j.setup) ? "🫣 揭晓谜底" : "👀 看下一句";
  if(fake[j.id]==null) fake[j.id] = 3 + Math.floor(R()*300);
  return `<div class="meta">${metaHTML(j)}</div>
    <p class="setup">${esc(j.setup)}</p>
    <div class="punchbox"><p class="punch">${esc(j.punch)}</p><span class="tape">${label}</span></div>
    ${j.note ? `<p class="note">${esc(j.note)}</p>` : ""}
    <div class="like"><button class="coin" data-id="${j.id}" title="投一枚冷币">${COIN_SVG}</button><span class="liketxt">觉得冷？投个币</span><span class="likecount" data-count="${j.id}">${fake[j.id]}</span></div>`;
}
function coverHTML(j, a){
  let middle = "", cls = a.pat, style = `--c:${a.color}`;
  if(a.kind==="pic"){ cls = "pic"; style = `background-image:url('${a.pic.src}')`; }
  else if(a.kind==="uni") middle = `<img class="uni" src="img/uni${a.uni}.png" alt="">`;
  else if(a.kind==="emoji") middle = `<span class="big">${EMOJI[j.topic]||"?"}</span>`;
  else middle = `<span class="big">?</span>`;
  return `<div class="cover ${cls}" style="${style}">${middle}<span class="hint">${EMOJI[j.topic]||"✨"} ${esc(j.topic)}</span></div>`;
}

/* 封面分配：图片各一次、贴纸各一次、emoji 每主题一次、底纹+颜色组合不重复 */
function assign(list){
  const n = list.length, order = shuffle(list.map((_,i)=>i)), out = new Array(n);
  const picIdx = order.slice(0, Math.min(PICS.length, n));
  const uniIdx = order.slice(PICS.length, PICS.length+6);
  const emojiTopics = new Set();
  const combos = shuffle(PATTERNS.flatMap(p => COLORS.map(c => [p,c])));
  list.forEach((j,i) => {
    const a = {pat: combos[i%combos.length][0], color: combos[i%combos.length][1], kind:"q"};
    const pi = picIdx.indexOf(i);
    if(pi >= 0){ a.kind="pic"; a.pic = PICS[pi]; }
    else if(uniIdx.includes(i)){ a.kind="uni"; a.uni = uniIdx.indexOf(i)+1; }
    else if(!emojiTopics.has(j.topic) && R()<.6){ a.kind="emoji"; emojiTopics.add(j.topic); }
    out[i] = a;
  });
  return out;
}

/* ---------- 石头山：中间被坐塌，左右两坡高低不对称，越往外越矮 ---------- */
function overlaps(r, rects, m){ return rects.some(o => r.x < o.x+o.w+m && r.x+r.w+m > o.x && r.y < o.y+o.h+m && r.y+r.h+m > o.y); }
function layout(list){
  const W = field.clientWidth, H = field.clientHeight;
  const n = list.length;
  /* 独角兽：坐在中间偏左或偏右一点 */
  const hh = clamp(H*.5, 200, 520), hw = hh/1.49;
  const cx = W*(.5 + rnd(-.07,.07)), hy = H*.92 - hh, hx = cx - hw/2;
  /* 山的轮廓 f(x)：离地高度。两个峰分别在独角兽两侧，高度、宽度各自随机 */
  const xl = cx - hw*.5 - rnd(40,140), xr = cx + hw*.5 + rnd(40,140);
  const pl = H*rnd(.5,.78), pr = H*rnd(.5,.78), sl = W*rnd(.13,.22), sr = W*rnd(.13,.22), base = H*rnd(.1,.2);
  const f = x => {
    let v = base + pl*Math.exp(-(((x-xl)/sl)**2)) + pr*Math.exp(-(((x-xr)/sr)**2));
    if(x > hx-20 && x < hx+hw+20) v = Math.min(v, H - (hy + hh*.3));   // 独角兽胸口以上不堆石头
    return Math.min(v, H - 12);
  };
  const fmax = Math.max(...Array.from({length:60},(_,i)=>f(W*i/59)));
  /* 石头大小：按山的面积均分，再随机放大缩小 */
  let area = 0; for(let i=0;i<60;i++) area += f(W*i/59) * (W/60);
  const s0 = clamp(Math.sqrt(area * .55 / Math.max(n,1)), 46, 230);
  const rainbowW = Math.min(460, W*.38);
  const reserved = [{x:0,y:0,w:rainbowW+10,h:rainbowW*.62}, {x:hx+hw*.08,y:hy+hh*.12,w:hw*.84,h:hh*.88}];
  const items = list.map((j,i) => {
    const a = this_covers[i];
    const side = s0 * (a.kind==="pic" ? rnd(1.4,1.8) : rnd(.6,1.45));
    let w = side, h = side;
    if(a.kind==="pic"){ w = side*Math.sqrt(a.pic.ar); h = side/Math.sqrt(a.pic.ar); } else { w *= rnd(.85,1.3); h *= rnd(.8,1.2); }
    return {j, a, w:Math.round(w), h:Math.round(h), tilt:rnd(-14,14)};
  });
  /* 大的先放，放不下就缩小 */
  const placed = reserved.slice();
  items.slice().sort((a,b)=>b.w*b.h-a.w*a.h).forEach(it => {
    let ok = false;
    for(let shrink=0; shrink<6 && !ok; shrink++){
      for(let t=0;t<260;t++){
        const x = rnd(0, W-it.w);
        if(R() > f(x+it.w/2)/fmax) continue;                      // 山高的地方石头密
        const top = H - f(x+it.w/2), ymin = Math.max(0, top), ymax = H - it.h;
        if(ymax < ymin) continue;
        const y = rnd(ymin, ymax);
        const r = {x,y,w:it.w,h:it.h};
        if(!overlaps(r, placed, 4)){ it.x=x; it.y=y; placed.push(r); ok=true; break; }
      }
      if(!ok){ it.w = Math.round(it.w*.88); it.h = Math.round(it.h*.88); }
    }
    if(!ok){ for(let t=0;t<400 && !ok;t++){ const r={x:rnd(0,W-it.w),y:rnd(0,H-it.h),w:it.w,h:it.h}; if(!overlaps(r,placed,2)){ it.x=r.x; it.y=r.y; placed.push(r); ok=true; } } }
    if(!ok){ it.x = rnd(0,W-it.w); it.y = H-it.h; }
  });
  /* 填缝的小石子 */
  const pebbles = [];
  for(let k=0;k<22;k++){
    const s = Math.round(rnd(14,34));
    for(let t=0;t<80;t++){ const x=rnd(0,W-s), y=rnd(Math.max(0,H-f(x)), H-s); if(y<0) continue; const r={x,y,w:s,h:s}; if(!overlaps(r,placed,3)){ pebbles.push({x,y,w:s,h:s*rnd(.7,1)}); placed.push(r); break; } }
  }
  return {items, pebbles, hero:{x:hx,y:hy,w:hw,h:hh}, W, H};
}

let this_covers = [], topZ = 0, current = null;
function render(animate){
  const list = jokes.filter(j => filter.k==="all" || j[filter.k]===filter.v);
  field.querySelectorAll(".card,.pebble,.empty").forEach(e=>e.remove());
  this_covers = assign(list);
  const L = layout(list);
  document.getElementById("rainbow").style.width = Math.min(460, L.W*.38) + "px";
  hero.style.width = L.hero.w+"px"; hero.style.left = L.hero.x+"px"; hero.style.top = L.hero.y+"px";
  const cx = L.hero.x + L.hero.w/2, cy = L.hero.y + L.hero.h*.75;
  L.pebbles.forEach((p,k) => {
    const el = document.createElement("div"); el.className="pebble";
    el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;background:${pick(COLORS)};--r:${blobRadius()};transform:rotate(${rnd(-30,30)}deg)`;
    field.appendChild(el);
    if(animate) flyIn(el, cx-p.x-p.w/2, cy-p.y-p.h/2, 0, 900+k*20);
  });
  L.items.forEach((it,i) => {
    const j = it.j, el = document.createElement("article");
    const k = clamp(Math.min(it.w,it.h)/200, .35, 1.2);
    el.className = `card ${j.lang==="zh"?"zh":""} ${Math.min(it.w,it.h)<95?"tiny":""}`;
    el.style.cssText = `left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;--tilt:${it.tilt.toFixed(1)}deg;--r:${blobRadius()};--k:${k.toFixed(2)}`;
    el.dataset.rect = JSON.stringify({x:it.x,y:it.y,w:it.w,h:it.h});
    el.innerHTML = `<button class="x" aria-label="合上">×</button><div class="inner">${bodyHTML(j)}</div>${coverHTML(j, it.a)}`;
    el.addEventListener("click", e => {
      if(e.target.closest(".x")){ closeCard(el); return; }
      const coin = e.target.closest(".coin"); if(coin){ dropCoin(coin); return; }
      if(!el.classList.contains("open")){ openCard(el); return; }
      const box = e.target.closest(".punchbox"); if(box) revealPunch(box);
    });
    field.appendChild(el);
    if(animate) flyIn(el, cx-it.x-it.w/2, cy-it.y-it.h/2, it.tilt, 950+i*22+rnd(0,120));
  });
  if(!list.length){ const e = document.createElement("div"); e.className="empty"; e.textContent="这里一块石头都没有。"; field.appendChild(e); }
  countEl.textContent = `${list.length} / ${jokes.length} 块`;
}

/* 石头打开：原地长大成卡片，不出屏幕；再点 × 或空白处缩回去 */
function openCard(el){
  if(current && current!==el) closeCard(current);
  const r = JSON.parse(el.dataset.rect), W = field.clientWidth, H = field.clientHeight;
  const first = el.getBoundingClientRect();
  const w = Math.min(380, W-24);
  el.classList.add("open"); el.style.width = w+"px"; el.style.height = "auto";
  const h = el.offsetHeight;
  const x = clamp(r.x + r.w/2 - w/2, 12, W-w-12), y = clamp(r.y + r.h/2 - h/2, 12, H-h-12);
  el.style.left = x+"px"; el.style.top = y+"px"; el.style.zIndex = 30 + (++topZ);
  const last = el.getBoundingClientRect();
  el.animate([
    {transform:`translate(${first.left-last.left}px,${first.top-last.top}px) scale(${first.width/last.width},${first.height/last.height}) rotate(var(--tilt))`, opacity:.6},
    {transform:"none", opacity:1}
  ], {duration:450, easing:"cubic-bezier(.2,1.3,.4,1)"});
  current = el;
  fitObs.observe(el);
}
const fitObs = new ResizeObserver(entries => entries.forEach(en => {
  const el = en.target; if(!el.classList.contains("open")) return;
  const H = field.clientHeight, h = el.offsetHeight;
  const y = clamp(parseFloat(el.style.top), 12, Math.max(12, H-h-12));
  if(Math.abs(y - parseFloat(el.style.top)) > 1) el.style.top = y + "px";
}));
function closeCard(el){
  fitObs.unobserve(el);
  const r = JSON.parse(el.dataset.rect);
  el.classList.remove("open");
  el.style.left = r.x+"px"; el.style.top = r.y+"px"; el.style.width = r.w+"px"; el.style.height = r.h+"px"; el.style.zIndex = "";
  const j = jokes.find(x => x.id == el.querySelector(".coin").dataset.id);
  el.querySelector(".inner").innerHTML = bodyHTML(j);      // 合上就复位：胶带贴回去
  el.querySelector(".slot")?.remove();
  el.animate([{transform:"scale(1.15) rotate(var(--tilt))"},{transform:"rotate(var(--tilt))"}], {duration:350, easing:"cubic-bezier(.2,1.4,.4,1)"});
  if(current===el) current = null;
}
field.addEventListener("click", e => { if(current && !e.target.closest(".card")) closeCard(current); });

function flyIn(el, dx, dy, tilt, delay){
  const a = el.animate([
    {opacity:0, transform:`translate(${dx}px,${dy}px) rotate(${tilt + rnd(-220,220)}deg) scale(.1)`, offset:0},
    {opacity:1, offset:.25},
    {opacity:1, transform:`translate(0,0) rotate(${tilt}deg) scale(1)`, offset:1}
  ], {duration: 850 + rnd(0,450), delay, easing:"cubic-bezier(.2,1.4,.4,1)", fill:"backwards"});
}
function heroDrop(){
  hero.animate([
    {transform:"translateY(-120vh) rotate(-8deg)", offset:0},
    {transform:"translateY(0) rotate(0)", offset:.75, easing:"cubic-bezier(.4,0,1,1)"},
    {transform:"translateY(0) scale(1.25,.72)", offset:.84},
    {transform:"translateY(-30px) scale(.92,1.08)", offset:.92},
    {transform:"translateY(0) scale(1,1)", offset:1}
  ], {duration:1250, easing:"ease-out", fill:"backwards"}).onfinish = shake;
}
function shake(){ document.body.animate([{transform:"translate(0,0)"},{transform:"translate(-6px,4px)"},{transform:"translate(5px,-3px)"},{transform:"translate(-3px,2px)"},{transform:"translate(0,0)"}], {duration:380}); }

/* 谜底揭晓 */
function revealPunch(box){
  if(box.classList.contains("shown") || box.classList.contains("drum")) return;
  box.classList.add("drum");
  setTimeout(() => { box.classList.remove("drum"); box.classList.add("shown"); burst(box); }, 480);
}
function burst(host, x, y, n=10){
  const colors = ["#e8f500","#ff8a3d","#f9a8d4","#5eead4","#b197fc","#fff"];
  for(let i=0;i<n;i++){
    const s = document.createElement("span"); s.className="spark";
    if(x!=null){ s.style.left = x+"px"; s.style.top = y+"px"; }
    const ang = (i/n)*Math.PI*2 + R(), d = 60 + R()*60;
    s.style.setProperty("--dx", Math.cos(ang)*d+"px"); s.style.setProperty("--dy", Math.sin(ang)*d+"px");
    s.innerHTML = `<svg viewBox="0 0 100 100"><path d="M50 5 L62 38 L95 50 L62 62 L50 95 L38 62 L5 50 L38 38 Z" fill="${colors[i%colors.length]}" stroke="#141414" stroke-width="8" stroke-linejoin="round"/></svg>`;
    host.appendChild(s); setTimeout(()=>s.remove(), 900);
  }
}

/* 投币（假计数） */
function dropCoin(btn){
  const host = btn.closest(".card, .box"), id = btn.dataset.id;
  let slot = host.querySelector(".slot");
  if(!slot){ slot = document.createElement("div"); slot.className="slot"; slot.innerHTML = `<span class="slit"></span><span class="lbl">投币口</span>`; host.appendChild(slot); }
  clearTimeout(slot._hide);
  requestAnimationFrame(() => slot.classList.add("show"));
  btn.classList.remove("bump"); void btn.offsetWidth; btn.classList.add("bump");
  const sx = btn.offsetLeft + btn.offsetParent.offsetLeft, sy = btn.offsetTop + btn.offsetParent.offsetTop;
  const ex = host.clientWidth - 14 - 59 - 20, ey = host.clientHeight - 16 - 62 + 14 - 20;
  const fly = document.createElement("div"); fly.className="flycoin"; fly.innerHTML = COIN_SVG;
  fly.style.left = sx + "px"; fly.style.top = sy + "px"; host.appendChild(fly);
  const dx = ex - sx, dy = ey - sy;
  fly.animate([
    {transform:"translate(0,0) rotate(0deg)", offset:0},
    {transform:`translate(${dx*0.5}px,${Math.min(dy,0)-90}px) rotate(200deg)`, offset:.5},
    {transform:`translate(${dx}px,${dy-6}px) rotate(360deg) scaleX(1)`, offset:.78},
    {transform:`translate(${dx}px,${dy+14}px) rotate(360deg) scaleX(.12)`, opacity:0, offset:1}
  ], {duration:900, easing:"cubic-bezier(.3,.9,.4,1)", fill:"forwards"}).onfinish = () => {
    fly.remove();
    slot.classList.remove("eat"); void slot.offsetWidth; slot.classList.add("eat");
    fake[id] = (fake[id]||0) + 1;
    document.querySelectorAll(`.likecount[data-count="${id}"]`).forEach(c => { c.textContent = fake[id]; c.classList.remove("up"); void c.offsetWidth; c.classList.add("up"); });
    const plus = document.createElement("span"); plus.className="plusone"; plus.textContent="+1";
    plus.style.left = (ex+20) + "px"; plus.style.top = (ey-10) + "px";
    host.appendChild(plus); setTimeout(()=>plus.remove(), 1000);
    burst(host, ex+20, ey+10, 8);
    slot._hide = setTimeout(() => slot.classList.remove("show"), 1300);
  };
}

/* 底部筛选 */
function buildChips(){
  const langs = ["zh","en","fr"].filter(l => jokes.some(j=>j.lang===l)).concat([...new Set(jokes.map(j=>j.lang))].filter(l=>!["zh","en","fr"].includes(l)));
  const topics = [...new Set(jokes.map(j=>j.topic))];
  const mk = (k,v,label) => { const b = document.createElement("button"); b.className="chip"; b.dataset.k=k; b.dataset.v=v; b.textContent=label; return b; };
  const anchor = document.getElementById("shuffle");
  langs.forEach(l => dock.insertBefore(mk("lang", l, LANG[l]||l), anchor));
  const sep = document.createElement("span"); sep.className="sep"; dock.insertBefore(sep, anchor);
  topics.forEach(t => dock.insertBefore(mk("topic", t, (EMOJI[t]||"")+" "+t), anchor));
}
dock.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b || !b.dataset.k) return;
  dock.querySelectorAll(".chip[data-k]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  filter = b.dataset.k==="all" ? {k:"all",v:null} : {k:b.dataset.k, v:b.dataset.v};
  current = null; render(true);
});
document.getElementById("rescatter").onclick = () => { current = null; heroDrop(); render(true); };

/* 随机弹窗 */
const modal = document.getElementById("modal"), mbody = document.getElementById("mbody");
function showRandom(){ const j = pick(jokes); mbody.className = j.lang==="zh" ? "zh" : ""; mbody.innerHTML = bodyHTML(j); modal.classList.add("show"); }
mbody.addEventListener("click", e => { const coin = e.target.closest(".coin"); if(coin){ dropCoin(coin); return; } const box = e.target.closest(".punchbox"); if(box) revealPunch(box); });
document.getElementById("shuffle").onclick = showRandom;
document.getElementById("again").onclick = showRandom;
document.getElementById("close").onclick = () => modal.classList.remove("show");
modal.addEventListener("click", e => { if(e.target===modal) modal.classList.remove("show"); });
document.addEventListener("keydown", e => { if(e.key==="Escape"){ modal.classList.remove("show"); if(current) closeCard(current); } });

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { current = null; render(false); }, 250); });

/* 先把图和字体全部加载完，再掉独角兽 */
function preload(){
  const bar = document.getElementById("bar");
  let done = 0; const total = PRELOAD.length + 1;
  const tick = () => { done++; bar.style.width = Math.round(done/total*100) + "%"; };
  const imgs = PRELOAD.map(src => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => { tick(); res(); }; im.src = src; }));
  const fonts = (document.fonts ? document.fonts.ready : Promise.resolve()).then(tick);
  return Promise.all([...imgs, fonts]);
}

Promise.all([fetch("jokes.json").then(r=>r.json()), preload()]).then(([d]) => {
  jokes = d.slice().sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  buildChips();
  const loader = document.getElementById("loader");
  loader.classList.add("off");
  setTimeout(() => { heroDrop(); render(true); }, 350);
}).catch(err => {
  document.querySelector(".loader .txt").textContent = "读不到 jokes.json：" + err.message;
});
</script>
